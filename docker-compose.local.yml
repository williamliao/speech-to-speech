services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.local

    command:
      - speech-to-speech
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8765"

      # STT：Transformers Whisper / Breeze
      - --stt
      - whisper
      - --stt_model_name
      - MediaTek-Research/Breeze-ASR-25
      - --stt_device
      - cuda
      - --stt_torch_dtype
      - float16
      - --language
      - zh

      # 降低 VAD／重開等待
      # VAD / latency tuning
      - --no_enable_live_transcription
      - --min_silence_ms
      - "200"
      - --speculative_reopen_ms
      - "200"
      - --unanswered_reopen_ms
      - "500"

      # LLM：連到 Windows 主機上的 llama-server
      - --llm_backend
      - chat-completions
      - --model_name
      - Gemma-4-31B-NVFP4
      - --responses_api_base_url
      - http://host.docker.internal:18010/v1
      - --responses_api_api_key
      - not-needed
      - --responses_api_stream

      # TTS：Windows 主機上的 VoxCPM OpenAI-compatible server
      - --tts
      - openai
      - --openai_tts_base_url
      - http://host.docker.internal:18881/v1
      - --openai_tts_model
      - voxcpm
      - --openai_tts_voice
      - default
      - --openai_tts_response_format
      - pcm
      - --openai_tts_sample_rate
      - "48000"
      - --openai_tts_stream
      - "true"

      # 系統提示
      - --init_chat_role
      - system
      - --init_chat_prompt
      - 請使用臺灣繁體中文回答。回答自然、簡潔，不要使用簡體中文，也不要使用 Markdown 格式。

    environment:
      # 主機 GPU 1 = RTX 5060 Ti
      # 容器裡會重新映射成 cuda:0
      CUDA_VISIBLE_DEVICES: "1"

      # Hugging Face cache 位置
      HF_HOME: /root/.cache/huggingface

    ports:
      - "8765:8765"
      - "12345:12345"
      - "12346:12346"

    volumes:
      - ./cache:/root/.cache

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

    restart: "no"